              - heading "Which cities does Carola operate in?" [level=3] [ref=e179]
            - img [ref=e181]
          - paragraph [ref=e185]: We currently operate in Rohtak, Gurugram, Panchkula, Karnal, Ambala, Hisar, Sonipat, Panipat, Chandigarh, Delhi-NCR and 22+ other cities across North India.
        - generic [ref=e186]:
          - button "booking How do I book a car with Carola?" [ref=e187] [cursor=pointer]:
            - generic [ref=e188]:
              - text: booking
              - heading "How do I book a car with Carola?" [level=3] [ref=e189]
            - img [ref=e191]
          - paragraph [ref=e195]: You can book directly on our website via the Search Bar, call us at +91 99999 99999, or visit any Carola branch. Online bookings are confirmed within 5 minutes.
        - generic [ref=e196]:
          - button "booking Can I cancel or modify my booking?" [ref=e197] [cursor=pointer]:
            - generic [ref=e198]:
              - text: booking
              - heading "Can I cancel or modify my booking?" [level=3] [ref=e199]
            - img [ref=e201]
          - paragraph [ref=e205]: Yes. Free cancellation up to 24 hours before pickup. Modifications are accepted up to 6 hours before pickup, subject to vehicle availability.
        - generic [ref=e206]:
          - button "booking How far in advance should I book?" [ref=e207] [cursor=pointer]:
            - generic [ref=e208]:
              - text: booking
              - heading "How far in advance should I book?" [level=3] [ref=e209]
            - img [ref=e211]
          - paragraph [ref=e215]: For regular cars, 24-48 hours is sufficient. For peak seasons (weddings, holidays) and luxury vehicles, we recommend booking 7-14 days in advance.
        - generic [ref=e216]:
          - button "pricing What's included in the rental price?" [ref=e217] [cursor=pointer]:
            - generic [ref=e218]:
              - text: pricing
              - heading "What's included in the rental price?" [level=3] [ref=e219]
            - img [ref=e221]
          - paragraph [ref=e225]: All prices include vehicle usage, basic insurance, 24/7 roadside assistance, and unlimited kilometers within city limits. Fuel is the customer's responsibility.
        - generic [ref=e226]:
          - button "pricing Are there any hidden charges?" [ref=e227] [cursor=pointer]:
            - generic [ref=e228]:
              - text: pricing
              - heading "Are there any hidden charges?" [level=3] [ref=e229]
            - img [ref=e231]
          - paragraph [ref=e235]: "No. Our pricing is fully transparent. The only additional charges may be: fuel, tolls, parking, traffic violations, or damages — all clearly itemized."
        - generic [ref=e236]:
          - button "pricing Do you offer long-term rentals?" [ref=e237] [cursor=pointer]:
            - generic [ref=e238]:
              - text: pricing
              - heading "Do you offer long-term rentals?" [level=3] [ref=e239]
            - img [ref=e241]
          - paragraph [ref=e245]: Yes! We offer monthly and yearly subscription plans with significant discounts. Visit our Pricing page or contact us for a custom quote.
        - generic [ref=e246]:
          - button "documents What documents do I need to rent a car?" [ref=e247] [cursor=pointer]:
            - generic [ref=e248]:
              - text: documents
              - heading "What documents do I need to rent a car?" [level=3] [ref=e249]
            - img [ref=e251]
          - paragraph [ref=e255]: "For self-drive: original driving license, Aadhaar/PAN, one passport-size photo. For chauffeur-driven: Aadhaar or any government ID is sufficient."
        - generic [ref=e256]:
          - button "documents Is there a security deposit?" [ref=e257] [cursor=pointer]:
